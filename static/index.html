<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontManager — 字体管理</title>
    <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔤 FontManager</h1>
            <p class="subtitle">拖拽或选择字体文件上传，自动入库管理</p>
        </header>

        <!-- Upload Section -->
        <div class="upload-section">
            <div id="dropzone" class="dropzone">
                <div class="dropzone-content">
                    <span class="dropzone-icon">📁</span>
                    <p>将字体文件拖拽到此处</p>
                    <p class="dropzone-hint">支持 TTF、OTF、TTC 格式</p>
                </div>
            </div>
            <div class="upload-buttons">
                <button type="button" id="fileBtn" class="btn btn-primary upload-btn">📎 选择文件上传</button>
                <button type="button" id="folderBtn" class="btn btn-secondary upload-btn">📂 选择文件夹上传</button>
            </div>
            <input type="file" id="fileInput" multiple accept=".ttf,.otf,.ttc" style="display:none">
            <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
        </div>

        <!-- Upload Results -->
        <div id="uploadResults" class="upload-results" style="display:none;">
            <h2>上传结果</h2>
            <div id="resultsList"></div>
        </div>

        <!-- Font List -->
        <div class="font-list-section">
            <div class="section-header">
                <h2>已入库字体</h2>
                <span id="fontCount" class="font-count"></span>
                <button id="refreshBtn" class="btn btn-secondary">🔄 刷新</button>
            </div>
            <div id="fontTable" class="font-table">
                <table>
                    <thead>
                        <tr>
                            <th>字体名称</th>
                            <th>样式</th>
                            <th>中文支持</th>
                            <th>格式</th>
                            <th>文件大小</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="fontTableBody">
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <p>暂无字体，上传文件开始添加</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="previewTitle">字体预览</h2>
                <button type="button" id="previewClose" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="subfontRow" class="preview-subfont-row" style="display:none;">
                    <label>字型：</label>
                    <select id="subfontSelect" class="preview-select"></select>
                </div>
                <!-- CJK warning banner -->
                <div id="cjkWarning" class="cjk-warning" style="display:none;"></div>
                <div class="preview-controls">
                    <input type="text" id="previewText" class="preview-input"
                           value="字体预览 FontPreview 123" placeholder="输入预览文字…">
                    <div class="preview-size-row">
                        <label>字号：</label>
                        <input type="range" id="previewSize" min="12" max="120" value="36">
                        <span id="previewSizeLabel">36px</span>
                    </div>
                </div>
                <div id="previewArea" class="preview-area">
                    字体预览 FontPreview 123
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=8"></script>
</body>
</html>
